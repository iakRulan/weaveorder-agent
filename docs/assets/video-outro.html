<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    background:
      radial-gradient(900px 520px at 85% 10%, rgba(94,234,212,.18), transparent 60%),
      radial-gradient(800px 500px at 10% 90%, rgba(96,165,250,.16), transparent 55%),
      #07111f;
    color: #f4fffd;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  .wrap { width: 1100px; max-width: 86vw; }
  h1 { font-size: 88px; line-height: 1.05; margin: 0 0 14px; letter-spacing: -.04em; }
  h1 span { color: #5eead4; font-size: 32px; letter-spacing: .16em; display: block; margin-top: 8px; font-weight: 500; }
  .line { font-size: 28px; color: #c7e3ef; margin: 20px 0 34px; }
  .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 40px; }
  .stats span { border: 1px solid rgba(94,234,212,.28); background: rgba(94,234,212,.07); color: #bff7ee; border-radius: 12px; padding: 14px 20px; font-size: 22px; }
  .repo { font-size: 24px; color: #8fb3c6; }
  .repo b { color: #f4fffd; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>织序 WeaveOrder<span>WEAVEORDER</span></h1>
    <div class="line">让智能体不只是会说，而是能把事做完、做对、做得可追溯。</div>
    <div class="stats">
      <span>Mock 10/10</span><span>Live 2/2</span><span>失败可恢复</span><span>全链路 Trace</span>
    </div>
    <div class="repo">github.com/<b>iakRulan/weaveorder-agent</b></div>
  </div>
</body>
</html>
